# Alternate inventory, NOT the default (hosts.ini stays the primary
# single-node example) - three genuinely separate Ansible inventory
# hosts (separate --limit targets, separate compose files thanks to
# cockroach_compose_root being host-scoped) that happen to all land on
# this one sandbox machine via ansible_connection=local. Used to verify
# scale-out/scale-in/decommission/HAProxy/monitoring for real without a
# second physical host - see docs/architecture.md section 0 for why this
# is a real verification of the mechanism, not a full HA test (all three
# "hosts" still share one real machine's fate).
#
# Real production Scenario B: same shape, but each entry is a real
# separate host (ansible_host=<real IP>, no ansible_connection=local).
#
# Per-node sql_port/http_port/advertise_addr are set in
# inventory/host_vars/crdb{1,2,3}.yml.

[cockroach_nodes]
crdb1 ansible_connection=local
crdb2 ansible_connection=local
crdb3 ansible_connection=local

# To try scale-out/scale-in for real: add a 4th entry here (with a
# matching inventory/host_vars/crdbN.yml, distinct sql_port/http_port),
# `ansible-playbook playbooks/scale_out.yml --limit crdbN`, then
# `ansible-playbook playbooks/scale_in.yml --limit crdbN` to decommission
# it back out. This is exactly how Phase 2's scale-out/scale-in roles
# were verified for real against this demo cluster.
