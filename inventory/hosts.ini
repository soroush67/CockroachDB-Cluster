# Placeholder inventory - this sandbox has no real multi-host environment
# yet, so [cockroach_nodes] deploys everything to this same machine via
# ansible_connection=local (matching the pattern used in
# gitlab-backup-with-jenkins-ansible/inventory/hosts.ini).
#
# For real production Scenario B (one CockroachDB node per independent
# physical/virtual host - the preferred production topology, see
# docs/architecture.md section 0), replace this with real hosts:
#
#   [cockroach_nodes]
#   crdb01 ansible_host=10.0.1.11 cockroach_advertise_addr=crdb01.example.internal
#   crdb02 ansible_host=10.0.1.12 cockroach_advertise_addr=crdb02.example.internal
#   crdb03 ansible_host=10.0.1.13 cockroach_advertise_addr=crdb03.example.internal
#
# Scenario A (multiple nodes on one host) is also supported by the same
# templates/docker-compose.yml.j2 - override cockroach_local_nodes in that
# host's host_vars instead of relying on the one-node-per-host default in
# group_vars/all.yml.

[cockroach_nodes]
localhost ansible_connection=local
